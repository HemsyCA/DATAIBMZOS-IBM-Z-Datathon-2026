# SepsisWatch Z — 4 services on the IBM z17 VM. No patient data leaves the machine.
# Setup once:  bash scripts/make_env.sh     (creates .env with keys and the base image name)
# Run:         docker compose up -d --build
# Dashboard:   http://localhost:8501  (from your laptop: ssh -L 8501:localhost:8501 linux1@<vm-ip>)

x-app: &app
  build:
    context: .
    dockerfile: services/Dockerfile
    args:
      BASE_IMAGE: ${BASE_IMAGE:-registry.linuxone.cloud.marist.edu/l1cc/jupyterlab-image-s390x:latest}
  image: sepsiswatch-z:latest
  env_file: .env
  user: "${UID_GID:-1000:1000}"
  volumes:
    - ${SHARED_DIR:-/home/linux1/shared}/sepsis:/data/sepsis
  restart: unless-stopped

services:
  scorer:
    <<: *app
    command: ["uvicorn", "services.scorer.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GRANITE_URL: http://granite:8080/note
      MODEL: ${MODEL:-ensemble}          # ensemble | xgb | mlp  (set it in .env)
    ports: ["127.0.0.1:${SCORER_HOST_PORT:-18000}:8000"]   # host 8000 is often taken on the VM
    depends_on: [granite]

  granite:
    <<: *app
    command: ["uvicorn", "services.granite.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      GRANITE_MODEL: /data/sepsis/models/granite-4.0-h-350m-base-be.f16.gguf
      GRANITE_THREADS: "3"

  replayer:
    <<: *app
    command: ["python", "-m", "services.replayer.main"]
    environment:
      SCORER_URL: http://scorer:8000
      DELAY_SEC: "${DELAY_SEC:-15}"
    depends_on: [scorer]

  dashboard:
    <<: *app
    command: ["uvicorn", "services.dashboard.main:app", "--host", "0.0.0.0", "--port", "8501"]
    ports: ["127.0.0.1:${DASHBOARD_HOST_PORT:-8501}:8501"]
